{% extends 'base.html' %}
{% load static %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 py-4">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="fm-card p-4 p-md-5 border-0 shadow-lg" style="border-radius: 1.5rem;">
      
      <!-- اللوجو الرسمي والعنوان البسيط -->
      <div class="text-center mb-4">
        <img src="{% static 'img/logo.jpg' %}" alt="Future Minds Academy" class="fm-brand-logo-lg mb-3">
        <h4 class="fw-bold mb-1" style="color: var(--fm-dark);">فيوتشر مايندز أونلاين</h4>
        <p class="text-muted small">منصة التعليم وإدارة الأكاديمية</p>
      </div>

      <!-- فورم الدخول -->
      <form method="POST" action="{% url 'login' %}" id="loginForm">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">اسم المستخدم</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-start-0"><i class="fa-solid fa-user text-muted"></i></span>
            <input type="text" name="username" id="usernameInput" class="form-control bg-light border-end-0 py-2" placeholder="اكتب اسم المستخدم" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">كلمة السر</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-start-0"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" name="password" id="passwordInput" class="form-control bg-light border-end-0 py-2" placeholder="اكتب كلمة السر" required>
          </div>
        </div>

        <button type="submit" class="btn btn-fm-primary w-100 py-2 mb-3 fs-6">
          <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i> تسجيل الدخول
        </button>
      </form>

      <!-- تجربة الحسابات بنقرة واحدة -->
      <div class="mt-4 pt-3 border-top">
        <p class="small text-muted text-center fw-bold mb-2">دخول سريع للتجربة</p>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-sm btn-outline-primary text-end d-flex align-items-center justify-content-between px-3 py-2 rounded-3" onclick="fillAndSubmit('admin', 'admin123')">
            <span><i class="fa-solid fa-shield-halved ms-2"></i> <strong>أدمن الأكاديمية</strong></span>
            <span class="badge bg-primary">دخول</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-info text-end d-flex align-items-center justify-content-between px-3 py-2 rounded-3" onclick="fillAndSubmit('menna', 'instructor123')">
            <span><i class="fa-solid fa-chalkboard-user ms-2"></i> <strong>المدرس (م/ منة - بايثون)</strong></span>
            <span class="badge bg-info text-dark">دخول</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-success text-end d-flex align-items-center justify-content-between px-3 py-2 rounded-3" onclick="fillAndSubmit('ahmed', 'student123')">
            <span><i class="fa-solid fa-laptop ms-2"></i> <strong>طالب أونلاين (أحمد)</strong></span>
            <span class="badge bg-success">دخول</span>
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary text-end d-flex align-items-center justify-content-between px-3 py-2 rounded-3" onclick="fillAndSubmit('omar', 'student123')">
            <span><i class="fa-solid fa-school ms-2"></i> <strong>طالب في المقر (عمر)</strong></span>
            <span class="badge bg-secondary">دخول</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  function fillAndSubmit(user, pass) {
    document.getElementById('usernameInput').value = user;
    document.getElementById('passwordInput').value = pass;
    document.getElementById('loginForm').submit();
  }
</script>
{% endblock %}
