{% extends 'base.html' %}
{% block title %}قواعد الحضور التلقائي{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-9 col-lg-7">
    <div class="fm-card p-4 p-md-5">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="p-3 bg-primary-subtle text-primary rounded-circle fs-3">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <div>
          <h4 class="fw-bold mb-0">قواعد الحضور التلقائي</h4>
          <p class="text-muted small mb-0">تحديد وقت الحضور والتأخير لما الطالب يضغط دخول الحصة.</p>
        </div>
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold">اسم القاعدة</label>
          <input type="text" name="name" value="{{ rule.name }}" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">السماح بدخول الحصة قبل ميعادها بـ (دقايق)</label>
          <div class="input-group">
            <input type="number" name="early_window_minutes" value="{{ rule.early_window_minutes }}" class="form-control" required>
            <span class="input-group-text bg-light">دقيقة</span>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold">مهلة الحضور في الميعاد بعد بدء الحصة (دقايق)</label>
          <div class="input-group">
            <input type="number" name="late_cutoff_minutes" value="{{ rule.late_cutoff_minutes }}" class="form-control" required>
            <span class="input-group-text bg-light">دقيقة</span>
          </div>
          <div class="form-text small">الدخول خلال المدة دي بيسجل الطالب <strong>حاضر</strong>، بعد كدة بيسجل <strong>متأخر</strong>.</div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{% url 'admin_dashboard' %}" class="btn btn-light border">إلغاء</a>
          <button type="submit" class="btn btn-fm-primary">حفظ الإعدادات</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
