{% extends 'base.html' %}
{% block title %}بياناتي{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="fm-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-bold fs-2 mb-2" style="width: 60px; height: 60px;">
          {{ user.first_name|default:user.username|slice:":1"|upper }}
        </div>
        <h4 class="fw-bold mb-1">{{ user.display_name }}</h4>
        <span class="badge bg-primary-subtle text-primary">{{ user.get_role_display }}</span>
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold">الاسم الأول</label>
            <input type="text" name="first_name" value="{{ user.first_name }}" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">اسم العائلة</label>
            <input type="text" name="last_name" value="{{ user.last_name }}" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">اسم المستخدم</label>
          <input type="text" value="{{ user.username }}" class="form-control bg-light" readonly>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">البريد الإلكتروني</label>
          <input type="email" value="{{ user.email }}" class="form-control bg-light" readonly>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold">رقم التليفون</label>
          <input type="text" name="phone" value="{{ user.phone|default:'' }}" class="form-control" placeholder="01xxxxxxxxx">
        </div>

        <button type="submit" class="btn btn-fm-primary w-100">حفظ التعديلات</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
